# Upload the CONTENTS of mobile as the repository root.
# Manual build only: no push triggers, signing secrets or store publishing.
# Xcode image: https://docs.codemagic.io/specs-macos/xcode-26-0/
workflows:
  ios-unsigned:
    name: iPhone — IPA for Sideloadly
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: "26.0.1"
      node: "22"
    scripts:
      - name: Build offline iPhone app without signing
        script: bash scripts/build-ios-unsigned.sh
    artifacts:
      - releases/quiet-rhythm-ios-unsigned.ipa
      - releases/quiet-rhythm-ios-unsigned.ipa.sha256
      - artifacts/ios/**/*.log
