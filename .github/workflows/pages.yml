name: Publish mobile app

on:
  push:
    branches: [main]
  release:
    types: [published, edited]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name != 'release' || (github.event.release.prerelease == false && github.event.release.draft == false)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Publish the current stable source even when a past release is edited.
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check rhythm and offline update logic
        run: node --test tests/subdivision.test.cjs tests/pwa.test.cjs
      - name: Build versioned offline app
        run: node scripts/build.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
